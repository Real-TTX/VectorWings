name: Build VectorWings

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    outputs:
      host: ${{ steps.version.outputs.host }}
      channel: ${{ steps.version.outputs.channel }}
      date: ${{ steps.version.outputs.date }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: VectorWings
      - id: version
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
          BUILD: ${{ github.run_number }}
        run: |
          host=main
          if git ls-remote --exit-code --heads https://github.com/Real-TTX/MatGame.git "refs/heads/$BRANCH" >/dev/null; then host="$BRANCH"; fi
          date=$(date -u +%Y%m%d)
          channel=local
          version="local-$date"
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            case "$BRANCH" in
              main) channel=release; version="0.3.$BUILD-$date" ;;
              dev) channel=nightly; version="nightly-$BUILD-$date" ;;
            esac
          fi
          printf 'host=%s\nchannel=%s\ndate=%s\nversion=%s\n' "$host" "$channel" "$date" "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Real-TTX/MatGame
          ref: ${{ steps.version.outputs.host }}
          path: MatGame
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: VectorWings/package-lock.json
      - name: Build client and test game
        working-directory: VectorWings
        run: |
          npm ci
          npm run build
          node --check src/VectorWings.Module/wwwroot/vendor/flight-bundle.js
          dotnet test -c Release
      - name: Build Windows package
        working-directory: VectorWings
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
          BUILD_DATE: ${{ steps.version.outputs.date }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ github.run_number }}
        run: |
          dotnet publish src/VectorWings.App -c Release -r win-x64 -o artifacts/windows \
            -p:Channel="$CHANNEL" -p:BuildNumber="$BUILD" -p:BuildDate="$BUILD_DATE"
          checksum=$(sha256sum artifacts/windows/VectorWings.exe | cut -d' ' -f1)
          printf '{"version":"%s","channel":"%s","buildNumber":%s,"setup":"VectorWings.exe","sha256":"%s"}\n' \
            "$VERSION" "$CHANNEL" "$BUILD" "$checksum" > artifacts/windows/vectorwings-update.json
      - uses: actions/upload-artifact@v4
        with:
          name: VectorWings-${{ steps.version.outputs.version }}-win-x64
          path: VectorWings/artifacts/windows/
          if-no-files-found: error

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: VectorWings
      - uses: actions/checkout@v4
        with:
          repository: Real-TTX/MatGame
          ref: ${{ needs.build.outputs.host }}
          path: MatGame
      - uses: docker/setup-buildx-action@v3
      - if: needs.build.outputs.channel != 'local'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: VectorWings
          build-contexts: matgame=MatGame
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.build.outputs.channel != 'local' }}
          tags: |
            ghcr.io/real-ttx/vectorwings:${{ needs.build.outputs.version }}
            ghcr.io/real-ttx/vectorwings:${{ needs.build.outputs.channel == 'release' && 'latest' || needs.build.outputs.channel }}
          build-args: |
            Channel=${{ needs.build.outputs.channel }}
            BuildNumber=${{ github.run_number }}
            BuildDate=${{ needs.build.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: needs.build.outputs.channel != 'local'
    needs: [build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VectorWings-${{ needs.build.outputs.version }}-win-x64
          path: windows
      - name: Publish in the MatGame update channel
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="$CHANNEL-channel"
          flags=()
          if [ "$CHANNEL" = nightly ]; then flags+=(--prerelease); fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${flags[@]}" --title "VectorWings – $CHANNEL" --notes "$VERSION"
          gh release upload "$tag" windows/VectorWings.exe windows/vectorwings-update.json --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes "$VERSION"
      - name: Trigger MatGame build
        env:
          GH_TOKEN: ${{ secrets.MATGAME_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "MATGAME_DISPATCH_TOKEN fehlt. MatGame wird mit seinem eigenen Workflow gebaut." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api repos/Real-TTX/MatGame/dispatches -f event_type=game-updated \
            -f "client_payload[game]=vectorwings" -f "client_payload[branch]=$GITHUB_REF_NAME" -f "client_payload[sha]=$GITHUB_SHA"
